# 用 GitHub 的苹果电脑编出一个没签名的 ipa（自签用）
name: iOS 安装包（未签名）
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 装依赖
        run: npm ci
      - name: 生成网页并同步到 iOS 工程
        run: |
          node tools/build-web.mjs
          npx cap sync ios
      - name: 编译（不签名）
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry fanpiao-unsigned.ipa Payload
          ls -la fanpiao-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: fanpiao-unsigned-ipa
          path: fanpiao-unsigned.ipa
          retention-days: 14
